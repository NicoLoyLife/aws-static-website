name: Terraform prüfen

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".tflint.hcl"
      - ".checkov.yaml"
      - ".github/workflows/terraform-checks.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".tflint.hcl"
      - ".checkov.yaml"
      - ".github/workflows/terraform-checks.yml"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Code auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Terraform installieren
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0

      - name: Formatierung prüfen
        run: terraform fmt -check -recursive

      # Ohne Backend, damit die Prüfung keinen Zugang zu AWS braucht.
      - name: Initialisieren
        run: terraform init -backend=false -input=false

      - name: Konfiguration validieren
        run: terraform validate

      - name: TFLint installieren
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.66.0

      - name: TFLint ausführen
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

      # Feste Version über pipx, die Docker-Action bringt eine veraltete Checkov-Version mit.
      - name: Checkov ausführen
        working-directory: .
        run: pipx run checkov==3.4.5 --config-file .checkov.yaml --directory . --quiet
